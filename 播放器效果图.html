<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPlayer - 现代化播放器界面预览</title>
<style>
  :root{
    --bg:#0b0b0b;
    --panel:#151515;
    --panel2:#1c1c1e;
    --text:#ffffff;
    --text2:#a1a1a6;
    --accent:#2563eb;
    --accent2:#3b82f6;
    --danger:#e81123;
    --border:rgba(255,255,255,.10);
    --hover:rgba(255,255,255,.08);
    --active:rgba(255,255,255,.14);
    --shadow:0 8px 30px rgba(0,0,0,.45);
    --radius:10px;
    --rchip:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:radial-gradient(1200px 600px at 50% 20%, #1a1a22 0%, #0b0b0b 60%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
    overflow:hidden;
  }
  /* 外壳：播放列表展开时整体变宽（向右膨出） */
  .shell{
    display:flex;flex-direction:row;
    transition:width .28s cubic-bezier(.4,0,.2,1);
    width:1100px;
  }
  .shell.pl-open{width:1420px;}
  .player{
    width:1100px;height:640px;flex:0 0 auto;
    background:#000;border-radius:14px;overflow:hidden;
    box-shadow:var(--shadow),0 0 0 1px var(--border);
    display:flex;flex-direction:column;
    position:relative;
  }
  /* 播放列表：展开时作为右侧兄弟面板，整体宽度增加 */
  .playlist{
    width:0;overflow:hidden;flex:0 0 auto;
    transition:width .28s cubic-bezier(.4,0,.2,1);
    border-radius:0 14px 14px 0;
  }
  .shell.pl-open .playlist{width:320px;}
  .pl-inner{
    width:320px;height:640px;
    background:linear-gradient(180deg, rgba(20,20,22,.98), rgba(14,14,16,.98));
    border-left:1px solid var(--border);
    display:flex;flex-direction:column;
    opacity:0;transition:opacity .22s .08s;
  }
  .shell.pl-open .pl-inner{opacity:1;}
  .pl-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px;}
  .pl-head .t{font-size:13px;font-weight:700;}
  .pl-close{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#d4d4d8;}
  .pl-close:hover{background:var(--hover);color:#fff;}
  .pl-list{flex:1;overflow-y:auto;padding:4px 8px 12px;}
  .pl-list::-webkit-scrollbar{width:6px;}
  .pl-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px;}
  .pl-item{display:flex;gap:10px;padding:7px;border-radius:9px;cursor:pointer;align-items:center;transition:.15s;}
  .pl-item:hover{background:rgba(255,255,255,.06);}
  .pl-item.playing{background:rgba(37,99,235,.18);}
  .pl-item.playing .pl-title{color:#bfd6ff;}
  .pl-thumb{width:100px;height:56px;border-radius:7px;flex:0 0 auto;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#26262c,#15151a);display:flex;align-items:center;justify-content:center;}
  .pl-thumb svg{width:20px;height:20px;fill:rgba(255,255,255,.25);}
  .pl-thumb .dur{position:absolute;right:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.72);padding:1px 4px;border-radius:4px;}
  .pl-meta{min-width:0;flex:1;}
  .pl-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pl-sub{font-size:11px;color:var(--text2);margin-top:2px;}
  .pl-state{font-size:10px;margin-top:3px;font-weight:700;letter-spacing:.3px;}
  .pl-state.playing{color:var(--accent2);}
  .pl-state.played{color:#6b7280;}
  .pl-state.unplayed{color:#3f3f46;}

  /* 视频区域 */
  .stage{
    flex:1;position:relative;
    background:
      radial-gradient(800px 400px at 50% 45%, #23232c 0%, #0d0d12 70%),
      linear-gradient(180deg,#111 0%,#000 100%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .stage::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .center-play{
    width:72px;height:72px;border-radius:50%;
    background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.75);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 24px rgba(0,0,0,.5);
    z-index:2;
  }
  .center-play svg{width:30px;height:30px;fill:#fff;margin-left:4px;}
  .subtitle-osd{
    position:absolute;left:0;right:0;bottom:46px;text-align:center;z-index:3;
    font-size:22px;font-weight:600;letter-spacing:.5px;
    text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 2px #000;
    pointer-events:none;
  }

  /* 顶部栏 */
  .topbar{
    position:absolute;top:0;left:0;right:0;height:52px;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;gap:12px;
    background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto;}
  .title-group{display:flex;align-items:center;gap:10px;min-width:0;}
  .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;}
  .chips{display:flex;gap:6px;}
  .chip{
    font-size:12px;padding:4px 10px;border-radius:var(--rchip);
    background:rgba(255,255,255,.10);color:var(--text2);
    border:1px solid var(--border);cursor:pointer;transition:.18s;
    white-space:nowrap;
  }
  .chip:hover{background:rgba(255,255,255,.16);color:#fff;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .top-actions{display:flex;gap:4px;}
  .iconbtn{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:transparent;color:#d4d4d8;cursor:pointer;border:1px solid transparent;
    transition:.18s;
  }
  .iconbtn:hover{background:var(--hover);color:#fff;}
  .iconbtn:active{background:var(--active);}
  .iconbtn svg{width:18px;height:18px;fill:currentColor;}

  /* 底部控制栏 */
  .controlbar{
    position:absolute;bottom:0;left:0;right:0;z-index:5;
    padding:0 16px 10px;gap:8px;display:flex;flex-direction:column;
    background:linear-gradient(0deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.25) 75%, rgba(0,0,0,0));
    pointer-events:none;
  }
  .controlbar > *{pointer-events:auto;}
  .row1{display:flex;align-items:center;gap:8px;}
  .ctrlbtn{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:transparent;color:#e4e4e7;cursor:pointer;border:1px solid transparent;
    transition:.18s;
  }
  .ctrlbtn:hover{background:var(--hover);color:#fff;}
  .ctrlbtn:active{background:var(--active);}
  .ctrlbtn.play{width:42px;height:42px;background:rgba(255,255,255,.92);color:#0b0b0b;}
  .ctrlbtn.play:hover{background:#fff;}
  .ctrlbtn svg{width:18px;height:18px;fill:currentColor;}
  .time{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;}

  /* 进度条 */
  .seekbar{
    height:18px;display:flex;align-items:center;cursor:pointer;position:relative;
    margin:2px 2px 4px;
  }
  .seektrack{
    position:relative;width:100%;height:4px;border-radius:4px;
    background:rgba(255,255,255,.18);transition:height .15s;
  }
  .seekbar:hover .seektrack{height:6px;}
  .seekbuffered{position:absolute;left:0;top:0;height:100%;width:42%;border-radius:4px;background:rgba(255,255,255,.30);}
  .seekfill{position:absolute;left:0;top:0;height:100%;width:28%;border-radius:4px;background:var(--accent);}
  .seekthumb{
    position:absolute;left:28%;top:50%;width:13px;height:13px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%) scale(0);
    box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .15s;
  }
  .seekbar:hover .seekthumb,.seekbar.dragging .seekthumb{transform:translate(-50%,-50%) scale(1);}

  .row2{display:flex;align-items:center;gap:4px;}
  .spacer{flex:1;}
  .textbtn{
    position:relative;
    font-size:12px;color:var(--text2);padding:6px 9px;border-radius:8px;cursor:pointer;
    background:transparent;border:1px solid transparent;transition:.18s;white-space:nowrap;
    display:flex;align-items:center;gap:5px;
  }
  .textbtn:hover{background:var(--hover);color:#fff;}
  .textbtn:active{background:var(--active);}
  .textbtn svg{width:15px;height:15px;fill:currentColor;}
  .volwrap{display:flex;align-items:center;gap:2px;}
  .volslider{width:0;overflow:hidden;display:flex;align-items:center;transition:width .2s;}
  .volwrap:hover .volslider,.volslider.open{width:80px;}
  .voltrack{width:70px;height:4px;border-radius:4px;background:rgba(255,255,255,.20);position:relative;cursor:pointer;}
  .volfill{position:absolute;left:0;top:0;height:100%;width:70%;border-radius:4px;background:#fff;}

  /* 弹出菜单：由 JS 动态定位到按钮左下角，确保左对齐 */
  .popmenu{
    position:absolute;background:rgba(24,24,26,.98);border:1px solid var(--border);
    border-radius:10px;padding:6px;box-shadow:var(--shadow);z-index:8;display:none;
    flex-direction:column;min-width:130px;
  }
  .popmenu.show{display:flex;}
  .popmenu .item{font-size:12.5px;padding:7px 10px;border-radius:7px;cursor:pointer;color:#e4e4e7;display:flex;justify-content:space-between;align-items:center;}
  .popmenu .item:hover{background:var(--hover);color:#fff;}
  .popmenu .item.sel{color:var(--accent2);}
  .popmenu .item .k{color:var(--text2);font-size:11px;}

  /* Toast */
  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:9;
    background:rgba(20,20,22,.94);border:1px solid var(--border);color:#fff;
    padding:8px 14px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 设置面板 */
  .settings{position:absolute;top:0;left:0;right:0;bottom:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);}
  .settings.show{display:flex;}
  .setbox{width:420px;background:#141416;border:1px solid var(--border);border-radius:14px;padding:18px 18px 14px;box-shadow:var(--shadow);}
  .setbox h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .setbox h3 .x{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#d4d4d8;}
  .setbox h3 .x:hover{background:var(--hover);color:#fff;}
  .setrow{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--border);}
  .setrow:last-child{border-bottom:none;}
  .switch{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;transition:.2s;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on{background:var(--accent);}
  .switch.on::after{transform:translateX(16px);}
  .seg{display:flex;background:rgba(255,255,255,.06);border-radius:8px;padding:2px;}
  .seg span{padding:4px 9px;border-radius:6px;font-size:11.5px;cursor:pointer;color:var(--text2);}
  .seg span.on{background:rgba(255,255,255,.14);color:#fff;}

  .dragtip{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.35);z-index:3;pointer-events:none;}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="player" id="player">
    <!-- 视频舞台 -->
    <div class="stage" id="stage">
      <div class="center-play" id="centerPlay">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="subtitle-osd" id="osd">然后我们也可以更快地分享给别人</div>
      <div class="dragtip">点击画面暂停 / 播放 · 拖动进度条试一试</div>

      <!-- 顶部栏 -->
      <div class="topbar">
        <div class="title-group">
          <div class="title" id="title">iPhone 拍摄 Log 入门教程.mp4</div>
          <div class="chips">
            <div class="chip active" data-chip="log">Log 入门</div>
            <div class="chip" data-chip="native">原生相机 Log</div>
            <div class="chip" data-chip="grade">调色思路</div>
          </div>
        </div>
        <div class="top-actions">
          <div class="iconbtn" title="截图" data-act="screenshot"><svg viewBox="0 0 24 24"><path d="M9 3 7.17 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3zm3 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></div>
          <div class="iconbtn" title="画中画/比例" data-act="pip"><svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8zM21 5H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg></div>
          <div class="iconbtn" title="播放列表" id="btnPlToggle"><svg viewBox="0 0 24 24"><path d="M3 13h12v-2H3zm0-4h18V7H3zm0 8h18v-2H3z"/></svg></div>
          <div class="iconbtn" title="最小化"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14z"/></svg></div>
          <div class="iconbtn" title="最大化"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zM19 14h-2v3h-3v2h5zm-2-9h3v3h2V5h-5z"/></svg></div>
          <div class="iconbtn" title="关闭" data-act="close"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59z"/></svg></div>
        </div>
      </div>

      <!-- 底部控制栏 -->
      <div class="controlbar" id="controlbar">
        <div class="seekbar" id="seekbar">
          <div class="seektrack">
            <div class="seekbuffered"></div>
            <div class="seekfill" id="seekfill"></div>
            <div class="seekthumb" id="seekthumb"></div>
          </div>
        </div>
        <div class="row1">
          <!-- 顺序：上一个 / 播放(居中) / 下一个 -->
          <div class="ctrlbtn" title="上一个" data-act="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></div>
          <div class="ctrlbtn play" id="btnPlay" title="播放/暂停">
            <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div class="ctrlbtn" title="下一个" data-act="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></div>
          <div class="time" id="time">00:00:19 / 02:48:45</div>
          <div class="spacer"></div>
          <div class="textbtn" id="btnSub" title="字幕">字幕<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM4 12h4v2H4zm0 4h8v2H4zm14-4h2v6h-2zm-4-4h6v2h-6zm0 3h6v2h-6z"/></svg></div>
          <div class="textbtn" id="btnSpeed" title="倍速">倍速 <span id="speedLabel" style="color:var(--accent2);font-weight:700">1.0x</span></div>
          <div class="textbtn" id="btnQuality" title="画质">至臻画质</div>
          <div class="volwrap">
            <div class="ctrlbtn" id="btnVol" title="静音"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg></div>
            <div class="volslider" id="volslider">
              <div class="voltrack" id="voltrack"><div class="volfill" id="volfill"></div></div>
            </div>
          </div>
          <div class="textbtn" id="btnSet" title="设置">设置<svg viewBox="0 0 24 24"><path d="M19.43 12.98a7.93 7.93 0 0 0 .14-1.98c0-.7-.08-1.38-.14-2.04l2.05-1.6a.5.5 0 0 0 .12-.64l-1.94-3.36a.5.5 0 0 0-.61-.22l-2.42.97a7.7 7.7 0 0 0-1.69-.98L14.5 2.6a.5.5 0 0 0-.5-.42h-3.88a.5.5 0 0 0-.5.42l.37 2.71c-.62.34-1.19.74-1.69.98l-2.42-.97a.5.5 0 0 0-.61.22L1.9 6.72a.5.5 0 0 0 .12.64l2.05 1.6c-.06.66-.14 1.34-.14 2.04 0 .7.08 1.38.14 1.98l-2.05 1.6a.5.5 0 0 0-.12.64l1.94 3.36a.5.5 0 0 0 .61.22l2.42-.97c.5.24 1.07.64 1.69.98l-.37 2.71a.5.5 0 0 0 .5.42h3.88a.5.5 0 0 0 .5-.42l-.37-2.71c.62-.34 1.19-.74 1.69-.98l2.42.97a.5.5 0 0 0 .61-.22l1.94-3.36a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></div>
          <div class="ctrlbtn" id="btnFull" title="全屏"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zM19 14h-2v3h-3v2h5zm-2-4h2V5h-5v2h3z"/></svg></div>
        </div>
      </div>

      <!-- 弹出菜单（绝对定位，由 JS 对齐到按钮） -->
      <div class="popmenu" id="menuSpeed">
        <div class="item" data-v="0.5">0.5x<span class="k">慢</span></div>
        <div class="item" data-v="0.75">0.75x</div>
        <div class="item sel" data-v="1.0">1.0x<span class="k">正常</span></div>
        <div class="item" data-v="1.25">1.25x</div>
        <div class="item" data-v="1.5">1.5x</div>
        <div class="item" data-v="2.0">2.0x<span class="k">快</span></div>
      </div>
      <div class="popmenu" id="menuQuality">
        <div class="item sel" data-q="best">至臻画质<span class="k">默认</span></div>
        <div class="item" data-q="1080">1080P</div>
        <div class="item" data-q="720">720P</div>
        <div class="item" data-q="480">480P</div>
        <div class="item" data-q="auto">自动</div>
      </div>

      <!-- 设置面板 -->
      <div class="settings" id="settings">
        <div class="setbox">
          <h3>设置 <span class="x" id="setClose"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59z"/></svg></span></h3>
          <div class="setrow"><span>硬件解码（D3D11VA / DXVA2）</span><div class="switch on" id="swHw"></div></div>
          <div class="setrow"><span>音量标准化（EBU R128）</span><div class="switch" id="swNorm"></div></div>
          <div class="setrow"><span>记忆播放位置</span><div class="switch on" id="swResume"></div></div>
          <div class="setrow"><span>自动播放下一个</span><div class="switch on" id="swAutoNext"></div></div>
          <div class="setrow"><span>字幕自动加载</span><div class="switch on" id="swSub"></div></div>
          <div class="setrow"><span>界面语言</span>
            <div class="seg" id="segLang"><span class="on">中文</span><span>English</span><span>日本語</span></div>
          </div>
          <div class="setrow"><span>主题</span>
            <div class="seg" id="segTheme"><span class="on">深色</span><span>浅色</span></div>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <!-- 右侧播放列表（与 player 并排，展开时整体宽度 +320px） -->
  <div class="playlist" id="playlist">
    <div class="pl-inner">
      <div class="pl-head">
        <div class="t">播放列表</div>
        <div class="pl-close" id="plClose" title="关闭列表"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59z"/></svg></div>
      </div>
      <div class="pl-list" id="plList"></div>
    </div>
  </div>
</div>

<script>
const $=(s)=>document.querySelector(s);
const $$=(s)=>document.querySelectorAll(s);
const player=$('#player'), stage=$('#stage'), toast=$('#toast'), shell=$('#shell');

let playing=true, speed=1.0, quality='best', muted=false, vol=0.7;
let progress=0.28;

function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);}

/* 播放/暂停 */
function togglePlay(){
  playing=!playing;
  $('#playIcon').innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $('#centerPlay').style.opacity=playing?1:0.9;
  showToast(playing?'已恢复播放':'已暂停');
}
$('#btnPlay').addEventListener('click',togglePlay);
$('#centerPlay').addEventListener('click',togglePlay);
stage.addEventListener('click',(e)=>{if(e.target===stage||e.target===stage.querySelector('.dragtip'))togglePlay();});

/* 章节 chip */
$$('.chip').forEach(c=>c.addEventListener('click',()=>{
  $$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');
  showToast('章节：'+c.textContent);
}));

/* 顶部按钮 */
$$('.top-actions .iconbtn').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act; if(!a) return;
  if(a==='screenshot')showToast('已截图（演示）');
  if(a==='close')showToast('关闭（演示）');
}));

/* 进度条拖拽 */
const seekbar=$('#seekbar');
let dragging=false;
function setProgress(p){progress=Math.max(0,Math.min(1,p));updateSeek();}
function updateSeek(){
  $('#seekfill').style.width=(progress*100)+'%';
  $('#seekthumb').style.left=(progress*100)+'%';
  const total=10085, cur=Math.floor(total*progress);
  const fmt=s=>{const m=Math.floor(s/60),ss=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');};
  $('#time').textContent=fmt(cur)+' / '+fmt(total);
}
seekbar.addEventListener('click',e=>{const r=seekbar.getBoundingClientRect();setProgress((e.clientX-r.left)/r.width);showToast('跳转到 '+Math.floor(progress*10085/60)+' 分');});
seekbar.addEventListener('mousedown',()=>dragging=true);
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('mousemove',e=>{if(dragging){const r=seekbar.getBoundingClientRect();setProgress((e.clientX-r.left)/r.width);}});
updateSeek();

/* 弹出菜单：动态定位到按钮左下角，保证左对齐且不超出右边界 */
function openMenu(menu, btn){
  closeAllMenus(menu);
  const r=btn.getBoundingClientRect(), pr=player.getBoundingClientRect();
  let left=r.left-pr.left;
  let top=r.bottom-pr.top+6;
  // 防止菜单右超出 player
  const mw=Math.max(130, menu.offsetWidth||130);
  if(left+mw > pr.width-8) left=pr.width-mw-8;
  menu.style.left=left+'px';
  menu.style.top=top+'px';
  menu.classList.add('show');
}
function closeAllMenus(except){$$('.popmenu').forEach(m=>{if(m!==except)m.classList.remove('show');});}

const menuSpeed=$('#menuSpeed'), menuQuality=$('#menuQuality');
$('#btnSpeed').addEventListener('click',e=>{openMenu(menuSpeed,$('#btnSpeed'));e.stopPropagation();});
$$('#menuSpeed .item').forEach(it=>it.addEventListener('click',()=>{
  $$('#menuSpeed .item').forEach(x=>x.classList.remove('sel'));it.classList.add('sel');
  speed=parseFloat(it.dataset.v);$('#speedLabel').textContent=speed+'x';
  showToast('播放速度：'+speed+'x');menuSpeed.classList.remove('show');
}));

$('#btnQuality').addEventListener('click',e=>{openMenu(menuQuality,$('#btnQuality'));e.stopPropagation();});
$$('#menuQuality .item').forEach(it=>it.addEventListener('click',()=>{
  $$('#menuQuality .item').forEach(x=>x.classList.remove('sel'));it.classList.add('sel');
  quality=it.dataset.q;$('#btnQuality').firstChild.textContent=it.textContent.replace(/\s.*/,'');
  showToast('画质：'+ (quality==='best'?'至臻画质':quality));menuQuality.classList.remove('show');
}));
document.addEventListener('click',()=>closeAllMenus(null));

/* 字幕 / 设置 */
$('#btnSub').addEventListener('click',()=>showToast('字幕：已开启（演示）'));
$('#btnSet').addEventListener('click',()=>$('#settings').classList.add('show'));
$('#setClose').addEventListener('click',()=>$('#settings').classList.remove('show'));
$('#settings').addEventListener('click',e=>{if(e.target===$('#settings'))$('#settings').classList.remove('show');});

/* 开关 */
$$('.switch').forEach(s=>s.addEventListener('click',()=>{s.classList.toggle('on');showToast(s.parentElement.querySelector('span').textContent.replace(/（.*）/,'')+'：'+(s.classList.contains('on')?'开':'关'));}));
/* segment */
$$('.seg').forEach(seg=>seg.querySelectorAll('span').forEach(sp=>sp.addEventListener('click',()=>{seg.querySelectorAll('span').forEach(x=>x.classList.remove('on'));sp.classList.add('on');showToast((seg.id==='segLang'?'语言：':'主题：')+sp.textContent);})));

/* 音量 */
$('#btnVol').addEventListener('click',()=>{muted=!muted;$('#volfill').style.width=(muted?0:(vol*100))+'%';showToast(muted?'已静音':'取消静音');});
$('#voltrack').addEventListener('click',e=>{const r=$('#voltrack').getBoundingClientRect();vol=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));$('#volfill').style.width=(vol*100)+'%';muted=false;});
$('#volslider').classList.add('open');setTimeout(()=>$('#volslider').classList.remove('open'),1200);

/* 全屏 */
$('#btnFull').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else player.requestFullscreen?.();showToast(document.fullscreenElement?'退出全屏':'全屏模式');});

/* 播放列表：向右膨出（整体宽度 +320px） */
const plList=$('#plList');
const items=[
  {t:'iPhone 拍摄 Log 入门教程',d:'02:48:45',state:'playing',sub:'正在播放'},
  {t:'原生相机 Log 色彩还原解析',d:'00:36:12',state:'played',sub:'已播放'},
  {t:'DaVinci 调色思路：从 Log 到 Rec.709',d:'01:12:08',state:'unplayed',sub:'未播放'},
  {t:'户外自然光下的 Log 拍摄技巧',d:'00:54:30',state:'unplayed',sub:'未播放'},
  {t:'Log 素材降噪与锐化实战',d:'00:42:55',state:'unplayed',sub:'未播放'},
  {t:'HDR 与 Log 工作流对比评测',d:'01:05:21',state:'unplayed',sub:'未播放'},
  {t:'手机剪辑：用 CapCut 处理 Log',d:'00:28:40',state:'unplayed',sub:'未播放'},
];
plList.innerHTML=items.map((it,i)=>`<div class="pl-item ${it.state==='playing'?'playing':''}" data-i="${i}">
  <div class="pl-thumb"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span class="dur">${it.d}</span></div>
  <div class="pl-meta"><div class="pl-title">${it.t}</div><div class="pl-sub">${it.state==='playing'?'教程 · 摄影':'教程 · 后期'}</div><div class="pl-state ${it.state}">${it.sub}</div></div>
</div>`).join('');
$$('.pl-item').forEach(el=>el.addEventListener('click',()=>{
  $$('.pl-item').forEach(x=>{x.classList.remove('playing');const s=x.querySelector('.pl-state');if(s){s.textContent='未播放';s.className='pl-state unplayed';}});
  el.classList.add('playing');const s=el.querySelector('.pl-state');s.textContent='正在播放';s.className='pl-state playing';
  showToast('切换到：'+items[+el.dataset.i].t);
}));
function togglePl(){shell.classList.toggle('pl-open');}
$('#btnPlToggle').addEventListener('click',togglePl);
$('#plClose').addEventListener('click',togglePl);

/* 上一个/下一个 */
$$('[data-act="prev"],[data-act="next"]').forEach(b=>b.addEventListener('click',()=>showToast(b.dataset.act==='prev'?'上一个（演示）':'下一个（演示）')));

/* 自动隐藏控制bar */
let hideT;function resetHide(){player.style.setProperty('--cb-opacity',1);clearTimeout(hideT);hideT=setTimeout(()=>player.style.setProperty('--cb-opacity',0.25),2500);}
player.addEventListener('mousemove',resetHide);resetHide();

/* 键盘 */
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowRight'){setProgress(progress+0.02);}
  if(e.code==='ArrowLeft'){setProgress(progress-0.02);}
  if(e.key==='m'||e.key==='M'){$('#btnVol').click();}
  if(e.key==='f'||e.key==='F'){$('#btnFull').click();}
  if(e.key==='l'||e.key==='L'){$('#btnPlToggle').click();}
});

/* 模拟播放进度 */
setInterval(()=>{if(playing){progress=Math.min(0.99,progress+0.0006*speed);updateSeek();}},1000);
</script>
</body>
</html>

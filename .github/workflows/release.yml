name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-mpv
            make

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.tag }}"
          $dir = "phantom_video-$ver-win64"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item "build\phantom_video.exe" "$dir\"
          Get-ChildItem "build\*.dll" | Copy-Item -Destination "$dir\"
          if (Test-Path "build\ico") { Copy-Item "build\ico" "$dir\ico" -Recurse }
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          echo "ZIP=$dir.zip" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Phantom Video ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
